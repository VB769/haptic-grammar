<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>触谱 Tactile Score · haptic-grammar</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,system-ui,"PingFang SC",sans-serif;padding:20px 16px 48px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  button{display:block;width:100%;margin:8px 0;padding:16px;border-radius:12px;border:1px solid var(--line);background:#21262d;color:var(--fg);font-size:16px;font-family:inherit;text-align:left}
  button:active{background:#30363d}
  button .k{font-weight:600}
  button .n{display:block;color:var(--dim);font-size:12px;font-family:ui-monospace,monospace;margin-top:2px}
  .row{display:flex;gap:8px}
  .warn{background:#3d1d1d;border-color:#6e2b2b;color:#ffb3ad;font-size:13px;padding:12px;border-radius:10px;margin-bottom:14px;display:none}
  .big{font-size:30px;text-align:center;padding:16px 0;font-weight:600}
  .opts button{display:inline-block;width:calc(50% - 4px);margin:4px 0;text-align:center;padding:14px 6px;font-size:15px}
  .stat{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-top:10px}
  .stat b{color:var(--fg)}
  textarea{width:100%;background:#0d1117;color:#8b949e;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px ui-monospace,monospace}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:28px;line-height:1.9}
  a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>

<h1>触谱 · Tactile Score</h1>
<div class="sub">v0.1 参考实现 · haptic-grammar</div>

<div class="warn" id="warn">这个浏览器不支持振动（iOS Safari 没有 Vibration API）。规范本身设备无关，iOS 需要 Core Haptics 原生实现。</div>

<div class="card">
  <h2>播放 / PLAY</h2>
  <div id="play"></div>
</div>

<div class="card">
  <h2>实验 / ABX</h2>
  <div class="big" id="q">点开始</div>
  <div class="opts" id="opts"></div>
  <div class="stat"><span>正确 <b id="ok">0</b> / <b id="total">0</b></span><span>准确率 <b id="acc">-</b></span></div>
  <div class="row">
    <button onclick="nextTrial(true)">开始 / 下一题</button>
    <button onclick="resetStats()">重置</button>
  </div>
</div>

<div class="card">
  <h2>导出 / EXPORT</h2>
  <button onclick="exportJSON()">复制混淆矩阵 JSON</button>
  <textarea id="out" rows="4" placeholder="点上面的按钮生成…"></textarea>
</div>

<footer>
  触谱规范：S=30ms · L=90ms · gap=60ms · word=240ms<br>
  <a href="https://github.com/VB769/haptic-grammar">github.com/VB769/haptic-grammar</a>
</footer>

<script>
const UNIT = { S: 30, L: 90, gap: 60, word: 240 };

const MOTIFS = {
  MOM_CALL : { p: "L gap S gap L word L",       d: "慢而长 = 家人；结尾重音 = 呼叫" },
  WORK_MSG : { p: "S gap S gap L word S S",     d: "快而碎 = 工作流" },
  CI_FAIL  : { p: "L gap L gap L word L L L L", d: "连击 = 立刻处理" },
  BATTERY  : { p: "S gap L word S gap S",       d: "下沉感 = 状态" },
};

function parse(score) {
  return score.trim().split(/\s+/).map(t => {
    if (!(t in UNIT)) throw new Error("未知符号: " + t);
    return UNIT[t];
  });
}

function play(score) {
  if (!navigator.vibrate) { document.getElementById("warn").style.display = "block"; return; }
  navigator.vibrate(parse(score));
}

if (!navigator.vibrate) document.getElementById("warn").style.display = "block";
const playBox = document.getElementById("play");
Object.entries(MOTIFS).forEach(([k, v]) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="k">${k}</span><span class="n">${v.p}　·　${v.d}</span>`;
  b.onclick = () => play(v.p);
  playBox.appendChild(b);
});

const KEYS = Object.keys(MOTIFS);
let trial = null, correct = 0, total = 0;
let matrix = {};
KEYS.forEach(a => { matrix[a] = {}; KEYS.forEach(b => matrix[a][b] = 0); });

function pick() { return KEYS[Math.floor(Math.random() * KEYS.length)]; }

function nextTrial() {
  const ans = pick();
  let other = pick();
  while (other === ans) other = pick();
  trial = { ans, other };
  document.getElementById("q").textContent = "哪一个是 " + ans + "？";

  const box = document.getElementById("opts");
  box.className = "opts";
  box.innerHTML = "";

  const order = Math.random() < 0.5 ? [ans, other] : [other, ans];
  trial.order = order;

  order.forEach((key, i) => {
    const b = document.createElement("button");
    b.textContent = (i === 0 ? "A：" : "B：") + key;
    b.onclick = () => answer(key);
    box.appendChild(b);
  });

  const again = document.createElement("button");
  again.textContent = "▶ 再播放一次";
  again.style.width = "100%";
  again.onclick = () => { play(MOTIFS[order[0]].p); setTimeout(() => play(MOTIFS[order[1]].p), 900); };
  box.appendChild(again);

  setTimeout(() => { play(MOTIFS[order[0]].p); setTimeout(() => play(MOTIFS[order[1]].p), 900); }, 300);
}

function answer(key) {
  if (!trial) return;
  const right = key === trial.ans;
  matrix[trial.ans][key] += 1;
  total += 1;
  if (right) correct += 1;
  document.getElementById("ok").textContent = correct;
  document.getElementById("total").textContent = total;
  document.getElementById("acc").textContent = (100 * correct / total).toFixed(0) + "%";
  document.getElementById("q").textContent = right ? "✓ 对了" : "✗ 正确答案是 " + trial.ans;
  setTimeout(nextTrial, 700);
}

function resetStats() {
  correct = 0; total = 0; trial = null;
  KEYS.forEach(a => KEYS.forEach(b => matrix[a][b] = 0));
  document.getElementById("ok").textContent = 0;
  document.getElementById("total").textContent = 0;
  document.getElementById("acc").textContent = "-";
  document.getElementById("q").textContent = "点开始";
  document.getElementById("opts").innerHTML = "";
}

function exportJSON() {
  const data = {
    spec: "haptic-grammar v0.1",
    units: UNIT,
    motifs: Object.fromEntries(Object.entries(MOTIFS).map(([k, v]) => [k, v.p])),
    confusion: matrix,
    trials: total,
    accuracy: total ? +(correct / total).toFixed(3) : null,
    ua: navigator.userAgent
  };
  const s = JSON.stringify(data, null, 2);
  document.getElementById("out").value = s;
  if (navigator.clipboard) navigator.clipboard.writeText(s);
}
</script>
</body>
</html>
